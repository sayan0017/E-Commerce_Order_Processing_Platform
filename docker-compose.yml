version: '3.9'

services:
  # ─── Infrastructure ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_secret
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce -d ecommerce']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  # ─── Microservices ──────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: ecommerce-auth
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@postgres:5432/ecommerce?schema=auth
      JWT_SECRET: super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 24h
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecommerce-net

  product-service:
    build:
      context: ./services/product
      dockerfile: Dockerfile
    container_name: ecommerce-product
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@postgres:5432/ecommerce?schema=product
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_change_in_production
      CACHE_TTL_LISTING: 300
      CACHE_TTL_DETAIL: 600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecommerce-net

  order-service:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: ecommerce-order
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@postgres:5432/ecommerce?schema=orders
      JWT_SECRET: super_secret_jwt_key_change_in_production
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - ecommerce-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ecommerce-net:
    driver: bridge
